services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      TLDR_DATA_DIR: /data
      TLDR_ISOLATED_NETWORK: "1"
      TLDR_EXTRACTOR_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
      HF_HOME: /data/huggingface
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - tldr_data:/data
    networks: [private]
    depends_on: [egress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 2.0
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  egress:
    build: ../backend
    command: ["python", "-m", "app.safe_proxy"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18766:8766"
    networks: [private, outbound]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  private:
    internal: true
  outbound: {}
volumes:
  tldr_data: {}
